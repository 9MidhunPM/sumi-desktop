# Sumi idle policy: lock after five minutes, blank displays after six minutes.
# Idle inhibitors from media players/presentations remain respected.
general {
    lock_cmd = systemctl --user start sumi-lock.service
    before_sleep_cmd = systemctl --user start sumi-lock.service
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    # Wait for the compositor's session-lock notification before releasing sleep.
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = systemctl --user start sumi-lock.service
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

