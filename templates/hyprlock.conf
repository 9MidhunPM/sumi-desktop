# Sumi fallback layout. The system's existing PAM policy is used unchanged.
general {
    hide_cursor = true
    ignore_empty_input = false
}

background {
    monitor =
    path = $sumi_wallpaper
    color = $sumi_panel
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
}

label {
    monitor =
    text = cmd[update:60000] date +"%H:%M"
    color = $sumi_main
    font_size = 96
    font_family = $sumi_font
    position = 0, 18%
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $sumi_soft
    font_size = 18
    font_family = $sumi_font
    position = 0, 10%
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 56
    outline_thickness = 1
    inner_color = $sumi_panel
    outer_color = $sumi_accent
    font_color = $sumi_main
    font_family = $sumi_font
    placeholder_text = Unlock your desktop
    fail_text = $PAMFAIL
    rounding = 16
    position = 0, -10%
    halign = center
    valign = center
}
